name: Aggiornamento giornaliero e sito

on:
  schedule:
    - cron: "17 4 * * *"   # ogni giorno alle 04:17 UTC (circa le 6 in Italia)
  workflow_dispatch:        # permette di avviarlo a mano dalla scheda Actions
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cerca nuove offerte
        run: |
          mkdir -p build
          python3 scraper/scrape.py \
            --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            --notify-out build/new_offers.md \
            --mention "${{ github.repository_owner }}"

      - name: Controlla che i dati siano validi
        run: python3 -c "import json; json.load(open('site/data/offers.json', encoding='utf-8')); print('offers.json valido')"

      - name: Salva i dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
          else
            git commit -m "Aggiornamento offerte $(date -u +%F)"
            git fetch origin
            # in caso di conflitto vince il file appena generato
            git rebase -X theirs origin/${{ github.ref_name }} || git rebase --abort || true
            git push origin HEAD:${{ github.ref_name }} || echo "Push non riuscito (non blocca il sito)."
          fi

      - name: Avvisa se ci sono nuove offerte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build/new_offers.md ]; then
            gh issue create \
              --title "Nuove offerte di stage ($(date -u +%F))" \
              --body-file build/new_offers.md \
              --assignee "${{ github.repository_owner }}" || true
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
